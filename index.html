<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmeScanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-main: #f4f7f9;
            --bg-card: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-badge {
            background: #e0f2fe;
            color: #0369a1;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all 0.2s ease-in-out;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .input-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        input[type="text"] {
            padding: 12px 16px;
            font-size: 16px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-weight: 500;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        input[type="text"]:disabled {
            background: #f8fafc;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
            white-space: nowrap;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            box-shadow: 0 6px 10px -1px rgba(2, 132, 199, 0.4);
        }

        .btn-success {
            background: var(--success);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover:not(:disabled) {
            background: var(--success-hover);
            box-shadow: 0 6px 10px -1px rgba(16, 185, 129, 0.4);
        }

        .btn-danger {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .btn-danger:hover:not(:disabled) {
            background: var(--danger);
            color: white;
        }

        button:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            border-color: transparent;
        }

        /* Painel de Sessão e Grade */
        #painelSessao {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sessao-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .sessao-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-prontuario {
            background: #0284c7;
            color: white;
            font-weight: 700;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .badge-contador {
            background: #e2e8f0;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .sessao-acoes {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Grade de Visualização das Páginas */
        .grade-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
            max-height: 380px;
            overflow-y: auto;
            padding: 4px;
        }

        .pagina-card {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .pagina-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .pagina-img-wrapper {
            width: 100%;
            height: 210px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pagina-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: white;
        }

        .pagina-footer {
            padding: 10px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .pagina-numero-badge {
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
        }

        /* Barra de Status */
        #status {
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.2s ease-out;
        }

        #status.mostrar {
            display: flex;
        }

        .sucesso {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .erro {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        /* Configurações Modal */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: transparent;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: #f1f5f9;
            color: var(--primary);
            border-color: var(--border);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        .modal-overlay.mostrar {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95);
            transition: transform 0.2s ease-out;
        }

        .modal-overlay.mostrar .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
    </style>
</head>

<body>
    <header>
        <h1>
            <img src="src/assets/scan_icon.png" width="32" height="32" alt="AmeScanner Logo"
                style="border-radius: 4px; object-fit: contain;">
            AmeScanner
        </h1>
        <div class="header-actions">
            <span class="header-badge">Prontuários Múltiplas Páginas</span>
            <button id="btnConfiguracoes" class="btn-icon" title="Configurações">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <div id="bannerContingencia" style="display: none; background-color: #ff9800; color: #fff; text-align: center; padding: 10px; font-weight: 600; font-size: 14px;">
        MODO CONTINGÊNCIA - API INDISPONÍVEL
    </div>

    <div class="card">
        <div class="input-group">
            <div class="input-wrapper">
                <label for="prontuario">Código de Agendamento</label>
                <input type="text" id="prontuario" placeholder="Ex.: 12345" autocomplete="off" autofocus>
            </div>
            <button id="btnBuscarAgendamento" class="btn-primary" style="margin-top: 22px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Buscar Agendamento
            </button>
            <button id="btnInserirManual" class="btn-secondary" style="margin-top: 22px; display: none; background: #607d8b; color: white;">
                Inserir Manualmente
            </button>
        </div>
    </div>

    <!-- Painel de Conferência de Dados -->
    <div id="painelDadosAgendamento" class="card" style="display: none; flex-direction: column; gap: 16px;">
        <h3
            style="font-size: 16px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 8px;">
            Dados do Agendamento (Conferência)</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 14px;">
            <div style="grid-column: 1 / -1;"><strong>Data:</strong> <span id="infoData">--</span></div>
            <div><strong>Paciente:</strong> <span id="infoPaciente">--</span></div>
            <div><strong>Prontuário:</strong> <span id="infoProntuario">--</span></div>
            <div><strong>Médico:</strong> <span id="infoMedico">--</span></div>
            <div><strong>Especialidade:</strong> <span id="infoEspecialidade">--</span></div>
            <div style="grid-column: 1 / -1; margin-top: 8px;">
                <label style="display: block; margin-bottom: 6px;">Categoria (Obrigatório)</label>
                <div style="display: flex; gap: 16px; margin-bottom: 12px;">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; text-transform: none; font-weight: normal; color: var(--text-main);">
                        <input type="radio" name="categoriaDocumento" value="Ficha" checked> Ficha
                    </label>
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; text-transform: none; font-weight: normal; color: var(--text-main);">
                        <input type="radio" name="categoriaDocumento" value="Laudo"> Laudo
                    </label>
                </div>
                
                <label for="tipoFicha" style="display: block; margin-bottom: 6px;">Tipo de Documento (Obrigatório)</label>
                <select id="tipoFicha" style="width: 100%; padding: 10px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 8px; outline: none;">
                    <option value="">-- Selecione o Tipo de Documento --</option>
                </select>
            </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 12px;">
            <button id="btnIniciarScan" class="btn-success">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
                Iniciar Digitalização
            </button>
        </div>
    </div>

    <!-- Painel da Sessão Ativa com a Grade de Visualização -->
    <div id="painelSessao" class="card">
        <div class="sessao-header">
            <div class="sessao-info">
                <span id="badgeProntuario" class="badge-prontuario">Prontuário: --</span>
                <span id="badgeContador" class="badge-contador">0 página(s)</span>
            </div>
            <div class="sessao-acoes">
                <button id="btnAdicionarPagina" class="btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    + Adicionar Página
                </button>
                <button id="btnConcluir" class="btn-success">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    ✓ Concluir e Salvar PDF
                </button>
                <button id="btnCancelar" class="btn-danger">
                    ✕ Cancelar
                </button>
            </div>
        </div>

        <div id="gradePaginas" class="grade-container">
            <!-- Os cartões (cards) de cada página escaneada serão inseridos aqui dinamicamente pelo renderer.js -->
        </div>
    </div>

    <div id="status"></div>

    <!-- Modal de Senha -->
    <div id="modalSenha" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Autenticação</h2>
                <button id="btnFecharModalSenha" class="btn-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-wrapper">
                    <label for="inputSenha">Digite a senha para acessar as configurações:</label>
                    <input type="password" id="inputSenha" autocomplete="off"
                        style="padding: 12px 16px; font-size: 16px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; margin-top: 8px;">
                </div>
            </div>
            <div class="modal-footer">
                <button id="btnCancelarSenha" class="btn-danger">Cancelar</button>
                <button id="btnConfirmarSenha" class="btn-success">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal Configurações -->
    <div id="modalConfiguracoes" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2>Configurações</h2>
                <button id="btnFecharModalConfig" class="btn-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-wrapper">
                    <label for="inputUrlApi">URL da API:</label>
                    <input type="text" id="inputUrlApi"
                        style="padding: 12px 16px; font-size: 16px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; margin-top: 8px; width: 100%; box-sizing: border-box;">
                </div>
                <div class="input-wrapper">
                    <label for="inputPastaDestino">Pasta para salvar os PDFs:</label>
                    <div class="input-group" style="margin-top: 8px;">
                        <input type="text" id="inputPastaDestino"
                            style="padding: 12px 16px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; flex: 1;">
                        <button id="btnSelecionarPasta" class="btn-secondary">Procurar</button>
                    </div>
                </div>
                <div class="input-wrapper" style="margin-top: 16px;">
                    <label for="inputPastaContingencia">Pasta de Contingência (em caso de falha na API):</label>
                    <div class="input-group" style="margin-top: 8px;">
                        <input type="text" id="inputPastaContingencia"
                            style="padding: 12px 16px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; flex: 1;">
                        <button id="btnSelecionarPastaContingencia" class="btn-secondary">Procurar</button>
                    </div>
                </div>
                <div class="input-wrapper" style="margin-top: 16px;">
                    <label for="inputTiposFicha">Tipos de Ficha (um por linha):</label>
                    <textarea id="inputTiposFicha" rows="4"
                        style="padding: 12px 16px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; margin-top: 8px; width: 100%; box-sizing: border-box; resize: vertical;"></textarea>
                </div>
                <div class="input-wrapper" style="margin-top: 16px;">
                    <label for="inputTiposLaudo">Tipos de Laudo (um por linha):</label>
                    <textarea id="inputTiposLaudo" rows="4"
                        style="padding: 12px 16px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; margin-top: 8px; width: 100%; box-sizing: border-box; resize: vertical;"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btnCancelarConfig" class="btn-danger">Cancelar</button>
                <button id="btnSalvarConfig" class="btn-success">Salvar Configurações</button>
            </div>
        </div>
    </div>

    <!-- Modal Inserção Manual -->
    <div id="modalManual" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Inserção Manual (Contingência)</h2>
                <button id="btnFecharModalManual" class="btn-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-wrapper" style="margin-bottom: 16px;">
                    <label for="inputManualBuscaPaciente">Procura Nome/Prontuário:</label>
                    <input list="listaPacientes" id="inputManualBuscaPaciente" placeholder="Digite para buscar..." autocomplete="off" style="padding: 12px 16px; font-size: 16px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; margin-top: 8px; width: 100%; box-sizing: border-box;">
                    <datalist id="listaPacientes"></datalist>
                </div>
